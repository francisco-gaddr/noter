services:
  mongodb:
    # Pinned to 8.2 — the series that created the Pi's data volume (mongo v8.2.10).
    # WiredTiger refuses to open a newer data dir on an older binary (exit 62), so the
    # pin must match (or exceed) the data's version. Bump this in lockstep if the data
    # is ever upgraded; never pin BELOW the on-disk version.
    image: mongo:8.2
    container_name: noter-mongodb
    # NOT published to the host — only the backend reaches it over the internal
    # Docker network (mongodb://mongodb:27017). Publishing 27017 exposed the
    # database to the host (and potentially the VPS) with no auth — a serious
    # data-exposure risk. `expose` keeps it network-internal only.
    expose:
      - "27017"
    security_opt:
      - no-new-privileges:true
    volumes:
      - mongodb_data:/data/db
    restart: always

  redis:
    # 8.x to match the on-disk RDB (redis 7.2 errored "Can't handle RDB format
    # version 14" — the dump was written by redis 8.x). Redis here is a disposable
    # cache (rate-limit + notes:list), so the volume can be reset if ever needed.
    image: redis:8-alpine
    container_name: noter-redis
    # Internal-only (see mongodb note).
    expose:
      - "6379"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # The redis-alpine entrypoint starts as root, chowns /data, then setpriv-drops
    # to the `redis` user. cap_drop:ALL removed the caps that needs and crash-looped
    # the container (`setpriv: setresuid failed: Operation not permitted`). Add back
    # only the four it requires: CHOWN (data dir), SETUID/SETGID/SETPCAP (drop).
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - SETPCAP
    volumes:
      - redis_data:/data
    restart: always

  # Self-hosted knowledge-graph store for the OPT-IN selective Neo4j sync (see
  # Doc/nextcloud-ingestion.md). Started only with the `neo4j` compose profile
  # (`docker compose --profile neo4j up -d`), so the default deploy is unchanged.
  # Like mongodb/redis it is NEVER published to the host — only the backend reaches
  # it over the internal Docker network (bolt://neo4j:7687). Auth required; password
  # comes from the gitignored .env (${NEO4J_PASSWORD}). Content reaches here only for
  # the folders the user explicitly selected, and never for locked notes.
  neo4j:
    image: neo4j:5
    container_name: noter-neo4j
    profiles: ["neo4j"]
    expose:
      - "7687"  # bolt — internal network only
      - "7474"  # http browser — internal network only
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD}
      - NEO4J_server_default__listen__address=0.0.0.0
    security_opt:
      - no-new-privileges:true
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    restart: always

  # Scheduled mongodump backups (disaster recovery). Reuses the mongo image so the dump tool matches
  # the server version. Archives go to the mongodb_backups volume with retention; restore via
  # apps/mongo-backup/restore.sh. See Doc/ops/disaster-recovery.md. Internal-only (reaches mongodb
  # over the Docker network); never publishes a port.
  mongo-backup:
    build:
      context: ./noter-app/apps/mongo-backup
      dockerfile: Dockerfile
    container_name: noter-mongo-backup
    environment:
      - MONGO_URI=mongodb://mongodb:27017/noter
      - BACKUP_INTERVAL_SECONDS=${BACKUP_INTERVAL_SECONDS:-86400}
      - BACKUP_RETENTION_DAYS=${BACKUP_RETENTION_DAYS:-7}
    security_opt:
      - no-new-privileges:true
    volumes:
      - mongodb_backups:/backups
    depends_on:
      - mongodb
    restart: always

  backend:
    build:
      context: ./noter-app
      dockerfile: apps/backend/Dockerfile
    container_name: noter-backend
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - MONGO_URI=mongodb://mongodb:27017/noter
      - REDIS_URL=redis://redis:6379
      - PORT=3001
      # Auth secret — value lives in the gitignored .env next to this compose
      # file (compose substitutes ${JWT_SECRET} at deploy time). Required in
      # production; backend throws AUTH_CONFIG without it.
      - JWT_SECRET=${JWT_SECRET}
      - JWT_ISSUER=${JWT_ISSUER:-daylited}
      - JWT_AUDIENCE=${JWT_AUDIENCE:-noter}
      # Selective Neo4j sync (opt-in). NEO4J_ENABLED!=1 → the /api/neo4j route is a
      # no-op kill-switch. The bolt URL stays on the internal Docker network.
      - NEO4J_ENABLED=${NEO4J_ENABLED:-0}
      # HTTP transactional API (no driver dependency); internal network only.
      - NEO4J_HTTP_URL=${NEO4J_HTTP_URL:-http://neo4j:7474}
      - NEO4J_USER=${NEO4J_USER:-neo4j}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-}
      - NEO4J_DATABASE=${NEO4J_DATABASE:-neo4j}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      - mongodb
      - redis
    restart: always

  web:
    build:
      context: ./noter-app
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: /api
        # Optional: set GLITCHTIP_WEB_DSN in .env to enable client error tracking (baked at build).
        NEXT_PUBLIC_GLITCHTIP_DSN: ${GLITCHTIP_WEB_DSN:-}
    container_name: noter-web
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=/api
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      - backend
    restart: always

  nginx:
    build:
      context: ./noter-app/apps/nginx
      dockerfile: Dockerfile
    container_name: noter-nginx
    ports:
      - "80:80"
    security_opt:
      - no-new-privileges:true
    # nginx drops to an unprivileged worker itself but needs NET_BIND_SERVICE to
    # bind :80, so we drop all caps and add only that one back.
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - CHOWN
      - SETGID
      - SETUID
    depends_on:
      - backend
      - web
    restart: always

  # --- Self-hosted error/crash tracking (GlitchTip, Sentry-API compatible) ----------------------
  # OPT-IN: started only with the `monitoring` profile (`docker compose --profile monitoring up -d`),
  # so the default deploy is unchanged and a resource-constrained Pi isn't forced to run it. The apps
  # report to it via GLITCHTIP_DSN (no-op when unset). The web UI (8000) is the ONLY published port —
  # link it from the Pi Hub. Postgres + Valkey stay internal. After first boot: open the UI, create an
  # org + a project, copy its DSN into .env as GLITCHTIP_DSN. See Doc/ops/error-tracking-glitchtip.md.
  # Resource note: ~512 MB RAM for the stack; WEB_CONCURRENCY/autoscale are kept low for the Pi.
  glitchtip-postgres:
    image: postgres:16-alpine
    container_name: noter-glitchtip-postgres
    profiles: ["monitoring"]
    expose:
      - "5432"  # internal network only
    environment:
      - POSTGRES_DB=glitchtip
      - POSTGRES_USER=glitchtip
      - POSTGRES_PASSWORD=${GLITCHTIP_POSTGRES_PASSWORD}
    security_opt:
      - no-new-privileges:true
    volumes:
      - glitchtip_pg_data:/var/lib/postgresql/data
    restart: always

  glitchtip-redis:
    image: valkey/valkey:8-alpine
    container_name: noter-glitchtip-redis
    profiles: ["monitoring"]
    expose:
      - "6379"  # internal network only
    security_opt:
      - no-new-privileges:true
    restart: always

  glitchtip:
    image: glitchtip/glitchtip:latest
    container_name: noter-glitchtip
    profiles: ["monitoring"]
    depends_on:
      - glitchtip-postgres
      - glitchtip-redis
    ports:
      - "8000:8080"  # web UI — the only published port; link from the Pi Hub
    environment:
      - DATABASE_URL=postgres://glitchtip:${GLITCHTIP_POSTGRES_PASSWORD}@glitchtip-postgres:5432/glitchtip
      - REDIS_URL=redis://glitchtip-redis:6379/0
      - SECRET_KEY=${GLITCHTIP_SECRET_KEY}
      - PORT=8080
      - GLITCHTIP_DOMAIN=${GLITCHTIP_DOMAIN:-http://localhost:8000}
      - DEFAULT_FROM_EMAIL=${GLITCHTIP_FROM_EMAIL:-noreply@noter.local}
      - EMAIL_URL=${GLITCHTIP_EMAIL_URL:-consolemail://}
      - ENABLE_OPEN_USER_REGISTRATION=False
      - WEB_CONCURRENCY=1
    security_opt:
      - no-new-privileges:true
    restart: always

  glitchtip-worker:
    image: glitchtip/glitchtip:latest
    container_name: noter-glitchtip-worker
    profiles: ["monitoring"]
    command: ./bin/run-celery-with-beat.sh
    depends_on:
      - glitchtip-postgres
      - glitchtip-redis
    environment:
      - DATABASE_URL=postgres://glitchtip:${GLITCHTIP_POSTGRES_PASSWORD}@glitchtip-postgres:5432/glitchtip
      - REDIS_URL=redis://glitchtip-redis:6379/0
      - SECRET_KEY=${GLITCHTIP_SECRET_KEY}
      - EMAIL_URL=${GLITCHTIP_EMAIL_URL:-consolemail://}
      - CELERY_WORKER_AUTOSCALE=1,2
      - CELERY_WORKER_MAX_TASKS_PER_CHILD=10000
    security_opt:
      - no-new-privileges:true
    restart: always

  # One-shot DB migration (GlitchTip runs migrations on `migrate`). on-failure so it retries until
  # postgres is ready, then exits 0 and stays down.
  glitchtip-migrate:
    image: glitchtip/glitchtip:latest
    container_name: noter-glitchtip-migrate
    profiles: ["monitoring"]
    command: ./manage.py migrate
    depends_on:
      - glitchtip-postgres
    environment:
      - DATABASE_URL=postgres://glitchtip:${GLITCHTIP_POSTGRES_PASSWORD}@glitchtip-postgres:5432/glitchtip
      - SECRET_KEY=${GLITCHTIP_SECRET_KEY}
    security_opt:
      - no-new-privileges:true
    restart: on-failure

volumes:
  mongodb_data:
  mongodb_backups:
  redis_data:
  neo4j_data:
  neo4j_logs:
  glitchtip_pg_data:
