services:
  mongodb:
    image: mongo:latest
    container_name: noter-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    restart: always

  redis:
    image: redis:alpine
    container_name: noter-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: always

  backend:
    build:
      context: ./noter-app
      dockerfile: apps/backend/Dockerfile
    container_name: noter-backend
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - MONGO_URI=mongodb://mongodb:27017/noter
      - REDIS_URL=redis://redis:6379
      - PORT=3001
      # Add other env vars here or use env_file
    depends_on:
      - mongodb
      - redis
    restart: always

  web:
    build:
      context: ./noter-app
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: /api
    container_name: noter-web
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=/api
    depends_on:
      - backend
    restart: always

  nginx:
    build:
      context: ./noter-app/apps/nginx
      dockerfile: Dockerfile
    container_name: noter-nginx
    ports:
      - "80:80"
    depends_on:
      - backend
      - web
    restart: always

volumes:
  mongodb_data:
  redis_data:
