<!doctype html>
<html lang="sv">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Noter Sidebar</title>
    <link rel="stylesheet" href="./sidebar.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div>
          <h1>Noter</h1>
          <p>Firefox-sidebar med snabbnavigering och fångstkö.</p>
        </div>
        <button id="open-app" type="button">Oppna app</button>
      </header>

      <section class="settings-card">
        <label for="base-url">App-URL</label>
        <div class="settings-row">
          <input id="base-url" type="url" placeholder="http://localhost:3000/app" />
          <button id="save-settings" type="button">Spara</button>
        </div>
        <p class="hint">Ladda webbappen i iframe nedan. Logga in i appen som vanligt for att se notes, projects, task lists och tasks.</p>
      </section>

      <section class="capture-card">
        <div class="section-header">
          <h2>Fangstko</h2>
          <button id="clear-captures" type="button">Rensa</button>
        </div>
        <ul id="capture-list" class="capture-list"></ul>
      </section>

      <main class="frame-wrap">
        <iframe id="noter-frame" title="Noter web app" sandbox="allow-scripts allow-same-origin allow-forms allow-downloads"></iframe>
      </main>

      <nav class="bottom-nav">
        <button data-view="notes" type="button" class="nav-button active">Notes</button>
        <button data-view="projects" type="button" class="nav-button">Projects</button>
        <button data-view="task-lists" type="button" class="nav-button">Task Lists</button>
        <button data-view="tasks" type="button" class="nav-button">Tasks</button>
      </nav>
    </div>
    <script src="./sidebar.js"></script>
  </body>
  </html>
