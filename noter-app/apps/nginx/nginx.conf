events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Don't leak the nginx version in responses / error pages.
    server_tokens off;

    # Docker's embedded DNS resolver
    # Using a resolver ensures Nginx doesn't crash if upstream services aren't ready at startup
    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 80;
        server_name localhost;
        proxy_hide_header Content-Security-Policy;
        add_header Content-Security-Policy "default-src 'self' https: data: 'unsafe-inline' 'unsafe-eval'; connect-src 'self' https: wss:; img-src 'self' https: data: blob:; style-src 'self' 'unsafe-inline' https:; font-src 'self' https: data:; script-src 'self' 'unsafe-inline' 'unsafe-eval' https:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;
        # Baseline security headers (OWASP secure-headers). HSTS is intentionally
        # NOT set here — TLS is terminated at the VPS edge, which is where HSTS
        # belongs; setting it on this HTTP listener could brick plain-HTTP access.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), interest-cohort=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;

        # Frontend Application - Preserve /app/ path for Next.js basePath
        location = /app {
            return 301 /app/;
        }

        location /app/ {
            set $web_target "http://web:3000/app/";
            proxy_pass $web_target;
            
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Backend API - Preserve /api path
        location /api/ {
            set $backend_target "http://backend:3001/api/";
            proxy_pass $backend_target;
            
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # CalDAV bridge — native clients (Tasks.org, Apple Reminders) speak WebDAV
        # verbs (PROPFIND/REPORT/PROPPATCH/MKCALENDAR) which nginx passes through
        # untouched (no limit_except here). The backend mounts /dav itself.
        location /dav/ {
            set $backend_dav "http://backend:3001/dav/";
            proxy_pass $backend_dav;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # CalDAV auto-discovery: clients probe the bare host here first.
        location = /.well-known/caldav {
            set $backend_wk "http://backend:3001/.well-known/caldav";
            proxy_pass $backend_wk;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Socket.IO
        location /socket.io/ {
            set $backend_socket "http://backend:3001";
            proxy_pass $backend_socket;
            
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Health check
        location /health {
            return 200 'OK';
            add_header Content-Type text/plain;
        }

        # Redirect root to /app
        location = / {
            return 301 /app/;
        }
    }
}
