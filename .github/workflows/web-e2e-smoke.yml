name: Web E2E Smoke

on:
  pull_request:
    paths:
      - '.github/workflows/web-e2e-smoke.yml'
      - 'noter-app/apps/web/**'
      - 'noter-app/packages/**'
      - 'noter-app/package.json'
      - 'noter-app/package-lock.json'
  push:
    branches:
      - main
      - master
    paths:
      - '.github/workflows/web-e2e-smoke.yml'
      - 'noter-app/apps/web/**'
      - 'noter-app/packages/**'
      - 'noter-app/package.json'
      - 'noter-app/package-lock.json'

jobs:
  cypress-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: noter-app/package-lock.json
      - name: Install monorepo dependencies
        run: npm ci
        working-directory: noter-app
      - name: Cypress smoke
        uses: cypress-io/github-action@v6
        with:
          install: false
          working-directory: noter-app/apps/web
          start: npm run dev
          wait-on: 'http://localhost:3001/app/'
          wait-on-timeout: 180
          command: npx cypress run --spec cypress/e2e/smoke.cy.ts
        env:
          WEB_BASE_PATH: app
          NEXT_PUBLIC_WEB_BASE_PATH: app
