name: CI

# Typecheck + tests + dead-code report for the noter-app monorepo and the
# Electron app. Blocking gates are kept to checks that are currently green so the
# required status never goes red through no fault of a PR; the flakier app suites
# and the knip backlog run as non-blocking reports until they are burned down
# (tracked in Doc/ops/ci-quality.md).

on:
  push:
    branches: [dev, main, 'agent/**']
  pull_request:
    branches: [dev, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Opt the JS actions (checkout/setup-node) into the Node 24 runtime now, so the
# "Node.js 20 actions are deprecated" annotations stop appearing. Node 24 becomes
# the runner default on 2026-06-16; this just removes the noise until then.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  app-quality:
    name: noter-app · typecheck, core tests, dead-code
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: noter-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Node 24: the AI-chat-persistence integration test uses the built-in `node:sqlite`
          # (stable since Node 24) to prove against a REAL SQLite engine that re-saving a
          # conversation never cascade-wipes its messages.
          node-version: 24
          cache: npm
          cache-dependency-path: noter-app/package-lock.json
      - run: npm ci

      # --- Blocking gates (currently green) ---
      - name: Typecheck (all workspaces)
        run: npm run check-types
      - name: Core package tests (shared + ai)
        run: npx turbo run test --filter=@repo/shared --filter=@repo/ai
      # Deterministic correctness gates for the features that kept regressing:
      # CalDAV/calendar 2-way sync (incl. undated tasks) + note-type classification
      # + share list selection. Kept SEPARATE from the flaky mobile suite so it can
      # be BLOCKING — these must never silently break again.
      - name: CalDAV/calendar 2-way + classification correctness (blocking)
        run: |
          (cd packages/shared && npx jest caldav calendar shareLists noteType)
          (cd apps/backend && npx jest caldav)
      # The recurring "AI chat history is empty" regressions get their OWN blocking gate
      # (the broad app suite below stays non-blocking during the flake burn-down, so these
      # critical persistence/lock tests must be pinned here or a real regression slips through).
      - name: AI chat persistence + safety (blocking)
        run: |
          node scripts/check-sql-cascade-replace.mjs
          (cd packages/shared && npx jest locks)
          (cd apps/mobile && npx jest __tests__/database-conversation-cascade.test.ts __tests__/ai-model-safety.test.ts tests/ai-sync-service.test.ts)
      # Hard locked-folder invariant: locked content must never reach an external publish
      # surface or a persistent index. The guard fails if the UI unlock set is fed into a
      # calendar/markdown-share projection, the Neo4j graph sync, or the embeddings index;
      # the neo4jSync suite proves the sync entry point excludes locked subtrees.
      - name: Locked-content leak guard (blocking)
        run: |
          node scripts/check-index-unlock-leak.mjs
          node scripts/check-index-unlock-leak.mjs --selftest
          (cd packages/shared && npx jest neo4jSync)
      # Invariant: encryption/decryption only via @repo/shared (no direct E2E cipher in apps).
      - name: Crypto-boundary guard (blocking)
        run: |
          node scripts/check-crypto-boundary.mjs
          node scripts/check-crypto-boundary.mjs --selftest
      # AI provider resilience: per-request timeouts + bounded transient retries (shared
      # httpRetry) and the streaming partial-keep / cancel / empty-stream-fallback
      # behaviour. Guards the "silent provider hangs the AI tab" and the duplicated-answer
      # regressions. Kept blocking because the broad web/mobile suites below are not yet.
      - name: AI provider resilience (blocking)
        run: |
          (cd packages/shared && npx jest httpRetry)
          (cd apps/web && npx jest __tests__/ai-streaming.test.ts)
          (cd apps/mobile && npx jest tests/api-providers.test.ts)
      # AI search & semantic retrieval (RAG). Validates the pipeline against the 2026 hybrid-search
      # standard: dense (cosine, dimension-safe) + sparse (lexical) fused with RRF (k=60) + a
      # query-aware rerank + optional GraphRAG; the encrypted on-device index (model/provider/dims
      # metadata, model-/provider-change re-embed, size cap); the context-level method gating; and
      # the lock-safe agent `search_notes` tool (a locked note/task can NEVER surface to the AI).
      # Blocking — semantic search + the lock guard on it are core, security-relevant functionality.
      - name: AI search & semantic retrieval — RAG correctness (blocking)
        run: |
          (cd packages/shared && npx jest vectorSearch retrieval vectorStore embeddings graphModel agentSearch contextLevels)
      # GDPR account data-export (access/portability) + deletion (erasure). Destructive + security-
      # sensitive: export must be COMPLETE (every user-keyed collection) yet leak NO secrets, and
      # both export and delete must be strictly own-data-only (IDOR) and gated by confirmation.
      - name: GDPR account export/delete (blocking)
        run: |
          (cd apps/backend && npx jest __tests__/routes/account.test.ts)
      # Tamper-evident audit log: HMAC-SHA256 hash chain (key held outside the DB). A DB-access
      # attacker can't modify/delete/forge an audit entry without breaking the chain — verifiable.
      - name: Audit-log integrity — tamper-evident chain (blocking)
        run: |
          (cd apps/backend && npx jest __tests__/utils/auditChain.test.ts __tests__/middleware/auditChainIntegration.test.ts)
      # Error reporter → GlitchTip: the Sentry envelope format must stay correct AND PII scrubbing must
      # never regress (note content/tokens must never reach the monitoring server). Blocking.
      - name: Error-tracking reporter — envelope + PII scrub (blocking)
        run: |
          (cd packages/shared && npx jest errorReporter)
      # List virtualization safety: windowing must NEVER engage in custom-sort (drag-and-drop) mode,
      # or DnD breaks. Guards the threshold decision + that VirtualList mounts.
      - name: Task list windowing safety (blocking)
        run: |
          (cd apps/web && npx jest __tests__/VirtualList.test.tsx)
      - name: No dead files (knip --include files)
        run: npm run knip:files

      # --- Non-blocking reports (burn-down in progress) ---
      - name: App tests (mobile + backend + web)
        continue-on-error: true
        run: npx turbo run test --filter=mobile --filter=backend --filter=web
      - name: Dead code & unused deps (knip)
        continue-on-error: true
        run: npm run knip

  web-build:
    name: web · next build (SSR)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: noter-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: noter-app/package-lock.json
      - run: npm ci
      # The jest/tsc gates never run a real Next build, so a build-time failure — a React
      # Compiler bail/error, a bad server/client boundary, a broken import — would only
      # surface on the Pi deploy. Build the SSR app here so it's caught in CI first.
      - name: Build web (SSR)
        run: cd apps/web && npx next build

  electron-quality:
    name: electron-noter · tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: electron-noter
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: electron-noter/package-lock.json
      - run: npm ci
      - name: Unit tests
        continue-on-error: true
        run: npm test
