name: Monorepo Guardrails

on:
  pull_request:
    paths:
      - '.github/workflows/monorepo-guardrails.yml'
      - 'README.md'
      - 'Doc/**'
      - 'noter-app/**'
  push:
    branches:
      - main
      - master
    paths:
      - '.github/workflows/monorepo-guardrails.yml'
      - 'README.md'
      - 'Doc/**'
      - 'noter-app/**'

jobs:
  validate-monorepo:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: noter-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: noter-app/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Validate prepush gates
        run: npm run validate:prepush
