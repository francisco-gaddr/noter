name: actionlint-rule-selftest

# Verifies our custom `persist-credentials` rule fires when a violating
# workflow is introduced. Without this self-test, a future refactor of the
# AWK script could silently make the rule a no-op while still exiting 0 in CI.
#
# The bad-workflow fixtures live in `.github/scripts/fixtures/*.yml.fixture`
# (NOT in `.github/workflows/`) so the rule itself never sees them as real
# workflows. The selftest stages them into a temp dir to run the rule against.

on:
  pull_request:
    paths:
      - '.github/scripts/check-checkout-credentials.sh'
      - '.github/scripts/fixtures/**'
      - '.github/workflows/actionlint-rule-selftest.yml'

permissions:
  contents: read

jobs:
  selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Positive case — real workflows pass
        run: ./.github/scripts/check-checkout-credentials.sh

      - name: Negative case 1 — missing persist-credentials is rejected
        shell: bash
        run: |
          set -euo pipefail
          STAGING=$(mktemp -d)
          mkdir -p "${STAGING}/.github/workflows" "${STAGING}/.github/scripts"
          cp .github/scripts/check-checkout-credentials.sh "${STAGING}/.github/scripts/"
          chmod +x "${STAGING}/.github/scripts/check-checkout-credentials.sh"
          cp .github/scripts/fixtures/bad-no-persist-credentials.yml.fixture "${STAGING}/.github/workflows/bad.yml"
          if (cd "${STAGING}" && ./.github/scripts/check-checkout-credentials.sh) > /dev/null 2>&1; then
            echo "::error::selftest FAILED: rule did NOT detect the violation"
            exit 1
          else
            echo "selftest OK: missing persist-credentials detected"
          fi

      - name: Negative case 2 — explicit `persist-credentials true` is rejected
        shell: bash
        run: |
          set -euo pipefail
          STAGING=$(mktemp -d)
          mkdir -p "${STAGING}/.github/workflows" "${STAGING}/.github/scripts"
          cp .github/scripts/check-checkout-credentials.sh "${STAGING}/.github/scripts/"
          chmod +x "${STAGING}/.github/scripts/check-checkout-credentials.sh"
          cp .github/scripts/fixtures/bad-persist-credentials-true.yml.fixture "${STAGING}/.github/workflows/bad.yml"
          if (cd "${STAGING}" && ./.github/scripts/check-checkout-credentials.sh) > /dev/null 2>&1; then
            echo "::error::selftest FAILED: explicit-true was accepted"
            exit 1
          else
            echo "selftest OK: explicit true rejected"
          fi
